name: Deterministic checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install CPU runtime and project
        run: |
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m ruff check .
      - name: Synthetic unit and integration checks (no provider keys or downloads)
        run: python -m pytest -q
