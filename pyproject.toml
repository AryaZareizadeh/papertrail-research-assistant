[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-research-assistant"
version = "0.1.0"
description = "Research-paper questions with traceable source evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1", "rank-bm25>=0.2.2", "sentence-transformers>=3.3",
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "pydantic>=2.10",
  "pyyaml>=6", "streamlit>=1.40", "tokenizers>=0.20", "huggingface-hub>=0.26",
  "python-dotenv>=1.0",
  "pypdf>=6.18,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
papertrail = "evidence_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence_assistant._vendor" = ["*.json", "LICENSE.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: explicitly enabled tests requiring downloaded models or external services"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/evidence_assistant/_vendor/qasper_evaluator.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
